name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Установить зависимости (torch для процессора)
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Восстановить кэш весов модели
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rubert-sentiment-v1

      - name: Быстрые тесты API (модель подменена)
        run: pytest -m "not model" -v

      - name: Тесты с настоящей моделью
        run: pytest -m model -v
